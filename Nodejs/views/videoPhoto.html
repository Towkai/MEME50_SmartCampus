<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <title>影像與照片預覽</title>
    <style>
        .container {
            display: flex;
            gap: 40px;
            align-items: flex-start;
        }

        .block {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        img {
            max-width: 45vw;
            margin-bottom: 10px;
            border: 1px solid #aaa;
        }
    </style>
</head>

<body>
    <h1>即時影像 + 圖片預覽</h1>
    <div class="container">
        <div class="block">
            <h2>Flask 串流</h2>
            <img src="http://192.168.51.12:3000/video_feed" alt="串流">
        </div>
        <div class="block">
            <h2>最新圖片</h2>
            <div id="gallery"></div>
        </div>
    </div>

    <script>
        async function loadImages() {
            const res = await fetch('/SamFacePhoto/images');
            const files = await res.json();

            // 把最新的放在最前面（也就是先出現的排在後面）
            files.reverse();

            const gallery = document.getElementById('gallery');
            gallery.innerHTML = '';
            files.forEach(file => {
                const img = document.createElement('img');
                img.src = '/images/' + file + '?t=' + Date.now(); // 避免快取
                gallery.prepend(img); // ← 用 prepend() 把最新的圖片放最上面
            });
        }

        loadImages();
        setInterval(loadImages, 5000); // 每 5 秒刷新一次
    </script>
</body>

</html>
